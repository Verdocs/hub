[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "verdocs-quickstart-python-server"
version = "1.0.0"
description = "Django quickstart for the Verdocs Python SDK: authenticate and create an envelope."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["django>=5,<6"]

[dependency-groups]
dev = ["pytest", "pytest-django", "respx"]

[tool.hatch.build.targets.wheel]
packages = ["quickstart", "insurance"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "quickstart.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
