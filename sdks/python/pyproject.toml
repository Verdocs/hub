# PEP 639 license expressions need hatchling 1.27 or newer.
[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "verdocs"
version = "1.0.0"
description = "Verdocs e-signing SDK for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Verdocs", email = "support@verdocs.com" }]
keywords = ["verdocs", "esignature", "esign", "signing", "documents", "pdf"]
# No "License :: OSI Approved" classifier here on purpose: PyPI rejects an upload
# that carries both a license classifier and a PEP 639 license expression.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28,<1", "pydantic>=2,<3"]

# No Repository or Issues link yet: this SDK lives in Verdocs/hub, which is still a
# private repo, and a 404 on the PyPI sidebar is worse than no link. Add both once
# hub goes public.
[project.urls]
Homepage = "https://verdocs.com"
Documentation = "https://developers.verdocs.com"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "griffe", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/verdocs"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
packages = ["verdocs"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The -m filter keeps the live conformance lane out of the default run; pass
# -m conformance explicitly to run it (the later -m on the command line wins).
addopts = "--import-mode=importlib -m 'not conformance'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "conformance: live checks against beta; excluded by default, run with pytest -m conformance",
]
