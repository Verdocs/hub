name: Release

# Manual trigger only. Run from the Actions tab: Release -> Run workflow.
# Defaults to a dry run, which does everything except push the version
# commit/tags and publish to npm, PyPI, and NuGet.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build/version/pack only, no push or publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

